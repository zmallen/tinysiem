[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysiem"
version = "0.0.0"
description = "A small detection engine for learning detection engineering"
license = {file = "LICENSE"}
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tinysiem = "tinysiem.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
